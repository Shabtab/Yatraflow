<!doctype html>
<html lang="en">
<head>
<!--
  Source for `public/og-default.png`: the 1200x630 link-preview card. The home
  page, the calculator page, every creator card and a coverless or missing
  itinerary use it. Regenerate it after a brand change with one command. The
  virtual-time budget lets the CDN webfonts load before the capture. An early
  capture ships fallback fonts, and no gate catches that. Give the screenshot
  an absolute path. With a relative path, Chrome can write nowhere and the
  old PNG stays. Chrome prints "bytes written to file" when the capture lands.

  "C:\Program Files\Google\Chrome\Application\chrome.exe" --headless=new --disable-gpu --hide-scrollbars --force-device-scale-factor=1 --window-size=1200,630 --virtual-time-budget=15000 --screenshot="<repo>\public\og-default.png" "file:///<repo>/scripts/og-default-card.html"

  Layout rules:
  - WhatsApp and some apps crop the card to a centre square (x 285 to 915).
    The Y mark, the wordmark, the headline and the four stop labels stay inside it.
  - The Y mark is the brand mark. Chakra the koel is a supporting character at
    the end of the route, outside the square, so a crop removes Chakra first.
  - Every text size is 28 px or more, so it reads at the 600 px thumbnail.

  The canvas is fixed and uses absolute positions. It loads the app's own faces:
  Sora for the headline, Plus Jakarta Sans for the labels. It is a picture, not
  a responsive surface. Do not reuse it as app UI.
-->
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet" />
<style>
  /* Dark-theme brand values from src/styles/tokens.css: navy ground, the
     bright teal and the dark saffron that the reversed mark uses. */
  :root {
    --navy: #0B2545;
    --cream: #F8F7EF;
    --teal-hi: #2BB8AC;
    --saffron: #F5A94A;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    background: var(--navy);
    font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    color: var(--cream);
    -webkit-font-smoothing: antialiased;
  }

  /* Light behind the headline, and a warm glow where the route ends. */
  .wash {
    position: absolute; inset: 0;
    background:
      radial-gradient(620px 340px at 50% 30%, rgba(43,184,172,.20), rgba(43,184,172,0) 70%),
      radial-gradient(520px 380px at 100% 100%, rgba(245,169,74,.16), rgba(245,169,74,0) 70%);
  }
  .route { position: absolute; inset: 0; }

  .center {
    position: absolute; left: 285px; top: 66px; width: 630px;
    display: flex; flex-direction: column; align-items: center; text-align: center;
  }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand span {
    font-family: 'Sora', sans-serif; font-weight: 800;
    font-size: 40px; letter-spacing: -.02em; color: #FFFFFF;
  }
  .brand em, h1 em { font-style: normal; color: var(--teal-hi); }
  h1 {
    margin-top: 32px;
    font-family: 'Sora', sans-serif; font-weight: 800;
    font-size: 66px; line-height: 1.06; letter-spacing: -.035em;
  }

  /* The four parts of the product, as the stops of one route. */
  .stops { position: absolute; top: 486px; left: 0; width: 1200px; }
  .stops span {
    position: absolute; width: 160px; margin-left: -80px; text-align: center;
    font-weight: 700; font-size: 30px; color: var(--cream);
  }

  /* Chakra stands at the end of the route. Its tail ends in a marigold map
     dot, which the dashed last leg meets. The render resolves the relative
     path from scripts/ to public/brand/mascot/. */
  .chakra { position: absolute; left: 950px; top: 298px; width: 232px; height: 232px; }
</style>
</head>
<body>
  <div class="wash"></div>

  <svg class="route" viewBox="0 0 1200 630" fill="none" aria-hidden="true">
    <!-- halo, then the road: it enters from the left edge and runs through the stops -->
    <path d="M-10,472 C120,472 220,450 360,450 L840,450"
          stroke="rgba(43,184,172,.22)" stroke-width="22" stroke-linecap="round" />
    <path d="M-10,472 C120,472 220,450 360,450 L840,450"
          stroke="#2BB8AC" stroke-width="6" stroke-linecap="round" />
    <!-- the leg still to travel: dashed, as a plan is, out to Chakra -->
    <path d="M840,450 C910,450 950,500 1004,500"
          stroke="#2BB8AC" stroke-width="5" stroke-linecap="round" stroke-dasharray="1 14" opacity=".8" />
    <!-- stops: Plan, Map and Budget ringed; Share is the destination sun -->
    <circle cx="360" cy="450" r="14" fill="#0B2545" stroke="#2BB8AC" stroke-width="5" />
    <circle cx="520" cy="450" r="14" fill="#0B2545" stroke="#2BB8AC" stroke-width="5" />
    <circle cx="680" cy="450" r="14" fill="#0B2545" stroke="#2BB8AC" stroke-width="5" />
    <circle cx="840" cy="450" r="27" fill="rgba(245,169,74,.30)" />
    <circle cx="840" cy="450" r="15" fill="#F5A94A" />
  </svg>

  <img class="chakra" src="../public/brand/mascot/chakra-night-hero.svg" alt="" />

  <div class="center">
    <div class="brand">
      <svg width="52" height="60" viewBox="7.5 5.5 49 56.5" aria-hidden="true">
        <path d="M15 6C15 26 32 24 32 40" fill="none" stroke="#BFE3DD" stroke-width="11" />
        <path d="M49 6C49 26 32 24 32 40V46" fill="none" stroke="#FFFFFF" stroke-width="11" />
        <circle cx="32" cy="56" r="5.5" fill="#F5A94A" />
      </svg>
      <span>Yatra<em>Flow</em></span>
    </div>
    <h1>India trips,<br /><em>planned together</em></h1>
  </div>

  <div class="stops">
    <span style="left:360px">Plan</span>
    <span style="left:520px">Map</span>
    <span style="left:680px">Budget</span>
    <span style="left:840px">Share</span>
  </div>
</body>
</html>
