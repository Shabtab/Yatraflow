<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" id="a-sleep"><style>
#a-sleep .blink,#a-sleep .wing,#a-sleep .fwing,#a-sleep .bwing,#a-sleep .tuft,#a-sleep .bob,#a-sleep .hop,#a-sleep .breathe,#a-sleep .float,#a-sleep .twinkle,#a-sleep .zz,#a-sleep .tear,#a-sleep .sweat,#a-sleep .spin,#a-sleep .coin,#a-sleep .steam path,#a-sleep .conf>*,#a-sleep .dots circle,#a-sleep .puffs path,#a-sleep .star{transform-box:fill-box;transform-origin:center}
#a-sleep .blink{animation:a-sleep-blink 4.6s infinite}
#a-sleep .tuft{transform-origin:50% 100%;animation:a-sleep-sway 3.4s ease-in-out infinite}
@keyframes a-sleep-blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
@keyframes a-sleep-sway{50%{transform:rotate(7deg)}}
#a-sleep .breathe{transform-origin:50% 100%;animation:a-sleep-breathe 3.8s ease-in-out infinite}@keyframes a-sleep-breathe{50%{transform:scale(1.015,1.035)}}
#a-sleep .tuft{animation:none}
#a-sleep .zz{animation:a-sleep-z 2.8s ease-out infinite}@keyframes a-sleep-z{0%{opacity:0;transform:translate(0,6px)}25%{opacity:.9}100%{opacity:0;transform:translate(8px,-16px)}}
#a-sleep .star{animation:a-sleep-tw 3s ease-in-out infinite}@keyframes a-sleep-tw{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){#a-sleep *{animation:none!important}}
</style><defs>
