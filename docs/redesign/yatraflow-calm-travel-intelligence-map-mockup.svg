<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1090" viewBox="0 0 1600 1090" role="img" aria-label="YatraFlow map view mockup using Calm Travel Intelligence design language">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ecf8f4"/><stop offset=".55" stop-color="#f8f7ef"/><stop offset="1" stop-color="#fff1e6"/></linearGradient>
  <linearGradient id="hero" x1="0" x2="1"><stop stop-color="#0d716b"/><stop offset=".52" stop-color="#104b59"/><stop offset="1" stop-color="#112c4c"/></linearGradient>
  <linearGradient id="land" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#badfd5"/><stop offset=".52" stop-color="#e1e9cf"/><stop offset="1" stop-color="#e8d9b5"/></linearGradient>
  <linearGradient id="route" x1="0" x2="1"><stop stop-color="#ed9a39"/><stop offset=".55" stop-color="#ffd27c"/><stop offset="1" stop-color="#e56d4e"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#143b41" flood-opacity=".19"/></filter>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#143b41" flood-opacity=".13"/></filter>
  <pattern id="roads" width="165" height="142" patternUnits="userSpaceOnUse"><path d="M-20 90C38 45 92 111 197 55" fill="none" stroke="#fffdf6" stroke-width="5" stroke-opacity=".7"/><path d="M-16 35C37 42 64 0 157 35" fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity=".7"/><path d="M75-8C68 44 112 83 79 151" fill="none" stroke="#dae9dc" stroke-width="3"/><path d="M7 123C45 96 97 128 165 100" fill="none" stroke="#c9dfe0" stroke-width="2"/></pattern>
</defs>
