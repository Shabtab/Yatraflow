<text x="65" y="1061" font-size="17" font-weight="700" fill="#14334d">4. Map — geographic clarity with calm, actionable overlays</text><text x="65" y="1083" font-size="13" fill="#5e7779">The map becomes a route-control surface: filters, stop context, nearby ideas and direct links back to precise Timeline or Board editing.</text>
