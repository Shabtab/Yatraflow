<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-label="YatraFlow share tab mockup using Calm Travel Intelligence design language">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ecf8f4"/><stop offset=".54" stop-color="#f8f7ef"/><stop offset="1" stop-color="#fff2e8"/></linearGradient>
  <linearGradient id="hero" x1="0" x2="1"><stop stop-color="#0d716b"/><stop offset=".52" stop-color="#104b59"/><stop offset="1" stop-color="#112c4c"/></linearGradient>
  <linearGradient id="cta" x1="0" x2="1"><stop stop-color="#0d9185"/><stop offset="1" stop-color="#0b6e69"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#143b41" flood-opacity=".17"/></filter>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#143b41" flood-opacity=".11"/></filter>
</defs>
<rect width="1600" height="1140" fill="url(#bg)"/>
<g font-family="Arial, sans-serif">
<!-- nav -->
<rect x="30" y="22" width="1540" height="62" rx="19" fill="#ffffffdc" stroke="#fff" filter="url(#soft)"/><circle cx="70" cy="53" r="16" fill="#103f49"/><path d="M62 57c4-11 10-11 16 0" fill="none" stroke="#68d1c1" stroke-width="2"/><text x="97" y="61" font-size="22" font-weight="700" fill="#143541">Yatra<tspan fill="#0b8f84">Flow</tspan></text><text x="261" y="59" font-size="13" font-weight="700" fill="#426064">My trips</text><text x="339" y="59" font-size="13" font-weight="700" fill="#426064">Plan a trip</text><text x="439" y="59" font-size="13" font-weight="700" fill="#426064">Explore</text><rect x="1410" y="37" width="116" height="31" rx="11" fill="#fff7ea" stroke="#eadfce"/><text x="1428" y="58" font-size="12" font-weight="700" fill="#765121">☾  🔔  H</text>
<!-- hero -->
<rect x="49" y="103" width="1502" height="112" rx="23" fill="url(#hero)" filter="url(#soft)"/><text x="80" y="135" font-size="12" font-weight="700" fill="#b9dcd7">← ALL TRIPS</text><text x="80" y="177" font-size="30" font-weight="700" fill="#fff">🎒 North South</text><text x="80" y="201" font-size="13" fill="#d2e7e3">Kolkata → Leh · 1–10 Sep 2026 · 4 travellers · Motorcycle · Relaxed</text><rect x="1311" y="142" width="205" height="44" rx="14" fill="#f4ab40"/><text x="1338" y="170" font-size="13" font-weight="700" fill="#19323d">Invite &amp; share →</text>
<!-- tabs -->
<text x="71" y="251" font-size="13" fill="#5b7275">Overview</text><text x="157" y="251" font-size="13" fill="#5b7275">Timeline</text><text x="241" y="251" font-size="13" fill="#5b7275">Board ✨</text><text x="327" y="251" font-size="13" fill="#5b7275">Map</text><text x="378" y="251" font-size="13" fill="#5b7275">Suggestions</text><text x="476" y="251" font-size="13" fill="#5b7275">Budget</text><text x="540" y="251" font-size="13" fill="#5b7275">Decisions</text><rect x="630" y="229" width="61" height="35" rx="12" fill="#e5f4ee"/><text x="647" y="251" font-size="13" font-weight="700" fill="#0b8178">Share</text><path d="M50 273H1550" stroke="#d6e2dc"/>
<!-- heading -->
<text x="74" y="326" font-size="24" font-weight="700" fill="#14334d">Bring the crew into the plan</text><text x="74" y="351" font-size="13" fill="#637b7d">Share a view-only itinerary, invite collaborators, or publish a trip other travellers can make their own.</text>
<!-- primary invite -->
<rect x="74" y="383" width="902" height="258" rx="24" fill="#143f4c" filter="url(#shadow)"/><text x="105" y="424" font-size="11" font-weight="700" fill="#c1e2dc">COLLABORATE ON THIS TRIP</text><text x="105" y="465" font-size="27" font-weight="700" fill="#fff">Invite people who need to plan with you.</text><text x="105" y="493" font-size="13" fill="#cbe3df">They can add stops, vote on decisions and see every route and budget change.</text>
<!-- email input -->
<rect x="105" y="525" width="513" height="49" rx="14" fill="#ffffffed"/><text x="126" y="556" font-size="13" fill="#708487">name@example.com</text><rect x="631" y="525" width="170" height="49" rx="14" fill="#f4aa3d"/><text x="662" y="556" font-size="13" font-weight="700" fill="#19333d">Send invite →</text><text x="105" y="610" font-size="11" fill="#a8d0ca">Invites give the recipient editor access. You can remove access anytime.</text>
<!-- current group -->
<rect x="997" y="383" width="524" height="258" rx="24" fill="#ffffffdc" stroke="#fff" filter="url(#soft)"/><text x="1024" y="424" font-size="11" font-weight="700" fill="#708486">YOUR TRIP CREW</text><text x="1024" y="462" font-size="20" font-weight="700" fill="#173e4a">1 planner, room for the crew</text><text x="1024" y="489" font-size="12" fill="#60787a">Bring in the people who will decide, drive or join.</text><circle cx="1044" cy="538" r="20" fill="#e7b486"/><text x="1038" y="544" font-size="13" font-weight="700" fill="#73451e">H</text><text x="1077" y="536" font-size="13" font-weight="700" fill="#244a51">Hasnaina</text><text x="1077" y="556" font-size="11" fill="#6b8183">Owner · can edit and invite</text><rect x="1024" y="586" width="225" height="31" rx="12" fill="#e7f5ef"/><text x="1042" y="607" font-size="11" font-weight="700" fill="#176a61">＋ Invite another traveller</text>
<!-- Share link section -->
<text x="74" y="704" font-size="17" font-weight="700" fill="#14334d">Share without editing</text><text x="74" y="727" font-size="12" fill="#697f81">Give anyone a live, view-only link to the itinerary. They never need an account to read it.</text>
<rect x="74" y="754" width="1447" height="113" rx="21" fill="#ffffffdc" stroke="#fff" filter="url(#soft)"/><text x="100" y="786" font-size="11" font-weight="700" fill="#718687">LIVE VIEW-ONLY LINK</text><rect x="100" y="802" width="1006" height="40" rx="12" fill="#f0f4f1"/><text x="119" y="827" font-size="13" fill="#4f686b">yatraflow.app/t/north-south-7KQ2</text><rect x="1120" y="802" width="113" height="40" rx="12" fill="#ffffff" stroke="#d9e6df"/><text x="1143" y="827" font-size="12" font-weight="700" fill="#176b62">Copy link</text><rect x="1247" y="802" width="250" height="40" rx="12" fill="#fff4e4"/><text x="1270" y="827" font-size="12" font-weight="700" fill="#a25f25">Open public preview →</text>
<!-- Publish / snapshot cards -->
<rect x="74" y="900" width="707" height="133" rx="22" fill="#fff7e9" stroke="#f4dfba" filter="url(#soft)"/><text x="101" y="932" font-size="11" font-weight="700" fill="#a36b2b">PUBLISH TO EXPLORE</text><text x="101" y="965" font-size="19" font-weight="700" fill="#5e4029">Let travellers discover and fork this itinerary.</text><text x="101" y="990" font-size="12" fill="#765e43">Your personal details stay private; publish only the trip plan and creator profile.</text><rect x="594" y="950" width="160" height="38" rx="13" fill="#f1a23b"/><text x="616" y="974" font-size="12" font-weight="700" fill="#1a3540">Prepare to publish →</text>
<rect x="805" y="900" width="716" height="133" rx="22" fill="#ffffffdc" stroke="#fff" filter="url(#soft)"/><text x="832" y="932" font-size="11" font-weight="700" fill="#718687">SAVE A SNAPSHOT</text><text x="832" y="965" font-size="19" font-weight="700" fill="#173e4a">Export a portable copy of the plan.</text><text x="832" y="990" font-size="12" fill="#60787a">Useful for a record, offline reference, or sending a static version to someone.</text><rect x="1326" y="950" width="168" height="38" rx="13" fill="#e7f4ee"/><text x="1347" y="974" font-size="12" font-weight="700" fill="#176b62">Download JSON ↓</text>
<!-- footer callout -->
<rect x="74" y="1060" width="1447" height="45" rx="16" fill="#143f4c" filter="url(#soft)"/><text x="98" y="1089" font-size="12" font-weight="700" fill="#fff">A shared trip stays clearer than a group chat.</text><text x="387" y="1089" font-size="12" fill="#c6e2dd">One plan, visible changes, real decisions and no “which hotel did we agree on?” messages.</text>
<text x="74" y="1130" font-size="17" font-weight="700" fill="#14334d">8. Share — separate collaboration, viewing, publishing and backup into clear choices</text>
</g></svg>