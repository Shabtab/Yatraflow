<rect x="813" y="382" width="333" height="187" rx="24" fill="#ffffffdd" stroke="#fff" filter="url(#soft)"/><text x="839" y="417" font-size="11" font-weight="700" fill="#718788">YOUR SHARE</text><text x="839" y="472" font-size="37" font-weight="700" fill="#173d4b">₹5,408</text><text x="839" y="499" font-size="13" fill="#5e7779">Per person · estimates only</text><rect x="839" y="522" width="151" height="27" rx="13" fill="#e8f5ef"/><text x="856" y="541" font-size="11" font-weight="700" fill="#176b62">₹842 under target</text>
<rect x="1169" y="382" width="352" height="187" rx="24" fill="#fff7e9" stroke="#f3dfba" filter="url(#soft)"/><text x="1195" y="417" font-size="11" font-weight="700" fill="#a36b2b">BUDGET WATCH</text><text x="1195" y="451" font-size="17" font-weight="700" fill="#5e4029">Day 3 has the biggest</text><text x="1195" y="475" font-size="17" font-weight="700" fill="#5e4029">cost uncertainty.</text><text x="1195" y="506" font-size="12" fill="#796040">Stay choice could change the</text><text x="1195" y="526" font-size="12" fill="#796040">group total by ₹1,200.</text><text x="1195" y="550" font-size="12" font-weight="700" fill="#a36024">Review decision →</text>
<!-- main section -->
<text x="74" y="625" font-size="17" font-weight="700" fill="#14334d">Where the money goes</text><text x="74" y="649" font-size="12" fill="#697f81">Transparent estimates — update individual items as bookings become real.</text>
<!-- category panel -->
<rect x="74" y="677" width="654" height="295" rx="22" fill="#ffffffdc" stroke="#fff" filter="url(#shadow)"/><text x="99" y="710" font-size="11" font-weight="700" fill="#718687">ESTIMATED BY CATEGORY</text>
<text x="99" y="751" font-size="13" font-weight="700" fill="#234a50">🏍 Transport &amp; fuel</text><text x="625" y="751" text-anchor="end" font-size="13" font-weight="700" fill="#234a50">₹8,960</text><rect x="99" y="764" width="527" height="10" rx="5" fill="#e8efeb"/><rect x="99" y="764" width="365" height="10" rx="5" fill="#0d8b80"/>
<text x="99" y="810" font-size="13" font-weight="700" fill="#234a50">🛏 Stays</text><text x="625" y="810" text-anchor="end" font-size="13" font-weight="700" fill="#234a50">₹6,800</text><rect x="99" y="823" width="527" height="10" rx="5" fill="#e8efeb"/><rect x="99" y="823" width="277" height="10" rx="5" fill="#55ae96"/>
<text x="99" y="869" font-size="13" font-weight="700" fill="#234a50">🍲 Food &amp; breaks</text><text x="625" y="869" text-anchor="end" font-size="13" font-weight="700" fill="#234a50">₹3,920</text><rect x="99" y="882" width="527" height="10" rx="5" fill="#e8efeb"/><rect x="99" y="882" width="160" height="10" rx="5" fill="#e8ae43"/>
<text x="99" y="928" font-size="13" font-weight="700" fill="#234a50">✦ Activities &amp; permits</text><text x="625" y="928" text-anchor="end" font-size="13" font-weight="700" fill="#234a50">₹1,953</text><rect x="99" y="941" width="527" height="10" rx="5" fill="#e8efeb"/><rect x="99" y="941" width="80" height="10" rx="5" fill="#897abb"/>
<!-- day-by-day -->
<rect x="751" y="677" width="770" height="295" rx="22" fill="#ffffffdc" stroke="#fff" filter="url(#shadow)"/><text x="777" y="710" font-size="11" font-weight="700" fill="#718687">COST BY DAY</text><text x="1487" y="710" text-anchor="end" font-size="11" font-weight="700" fill="#0b8178">See all expense items →</text>
<text x="777" y="753" font-size="13" font-weight="700" fill="#234a50">Day 1 · Kolkata → Bihar</text><rect x="1001" y="739" width="358" height="18" rx="9" fill="#e9efeb"/><rect x="1001" y="739" width="218" height="18" rx="9" fill="#0d8b80"/><text x="1485" y="753" text-anchor="end" font-size="13" font-weight="700" fill="#234a50">₹4,248</text>
<text x="777" y="805" font-size="13" font-weight="700" fill="#234a50">Day 2 · Bihar → Sarchu</text><rect x="1001" y="791" width="358" height="18" rx="9" fill="#e9efeb"/><rect x="1001" y="791" width="176" height="18" rx="9" fill="#55ae96"/><text x="1485" y="805" text-anchor="end" font-size="13" font-weight="700" fill="#234a50">₹3,420</text>
<rect x="768" y="830" width="729" height="47" rx="14" fill="#fff6e9"/><text x="782" y="858" font-size="13" font-weight="700" fill="#8f5b26">⚠ Day 3 · Sarchu → Leh</text><rect x="1001" y="844" width="358" height="18" rx="9" fill="#f1e5d4"/><rect x="1001" y="844" width="292" height="18" rx="9" fill="#e5a13f"/><text x="1485" y="858" text-anchor="end" font-size="13" font-weight="700" fill="#8f5b26">₹5,610*</text>
<text x="782" y="897" font-size="11" fill="#866643">*Includes unconfirmed overnight stay — decision pending</text>
<text x="777" y="936" font-size="13" font-weight="700" fill="#234a50">Remaining 7 days</text><rect x="1001" y="922" width="358" height="18" rx="9" fill="#e9efeb"/><rect x="1001" y="922" width="254" height="18" rx="9" fill="#897abb"/><text x="1485" y="936" text-anchor="end" font-size="13" font-weight="700" fill="#234a50">₹8,355</text>
<!-- budget reassurance and CTA -->
<rect x="74" y="998" width="1447" height="62" rx="19" fill="#143f4c" filter="url(#soft)"/><text x="101" y="1034" font-size="14" font-weight="700" fill="#fff">✦ Keep estimates honest</text><text x="310" y="1034" font-size="13" fill="#c5e1dc">When you move a stop or choose a different stay, YatraFlow previews the new total before you save.</text><text x="1326" y="1034" font-size="12" font-weight="700" fill="#ffcc74">Review changes →</text>
<text x="74" y="1114" font-size="17" font-weight="700" fill="#14334d">7. Budget — transparent, group-aware and connected to route decisions</text><text x="74" y="1135" font-size="13" fill="#5e7779">The design keeps the familiar totals but makes uncertainty, per-person accountability and the cost of itinerary changes easier to understand.</text>
</g></svg>