<text x="74" y="326" font-size="24" font-weight="700" fill="#14334d">A budget the group can trust</text><text x="74" y="351" font-size="13" fill="#637b7d">See the total, your per-person estimate and exactly what route changes will cost.</text><rect x="1314" y="300" width="207" height="42" rx="14" fill="url(#cta)" filter="url(#soft)"/><text x="1336" y="327" font-size="13" font-weight="700" fill="#fff">＋ Add an expense</text>
