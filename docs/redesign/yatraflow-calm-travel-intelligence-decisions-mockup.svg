<rect x="30" y="22" width="1540" height="62" rx="19" fill="#ffffffdc" stroke="#fff" filter="url(#soft)"/><circle cx="70" cy="53" r="16" fill="#103f49"/><path d="M62 57c4-11 10-11 16 0" fill="none" stroke="#68d1c1" stroke-width="2"/><text x="97" y="61" font-size="22" font-weight="700" fill="#143541">Yatra<tspan fill="#0b8f84">Flow</tspan></text><text x="261" y="59" font-size="13" font-weight="700" fill="#426064">My trips</text><text x="339" y="59" font-size="13" font-weight="700" fill="#426064">Plan a trip</text><text x="439" y="59" font-size="13" font-weight="700" fill="#426064">Explore</text><rect x="1410" y="37" width="116" height="31" rx="11" fill="#fff7ea" stroke="#eadfce"/><text x="1428" y="58" font-size="12" font-weight="700" fill="#765121">☾  🔔  H</text>
<!-- hero -->
<rect x="49" y="103" width="1502" height="112" rx="23" fill="url(#hero)" filter="url(#soft)"/><text x="80" y="135" font-size="12" font-weight="700" fill="#b9dcd7">← ALL TRIPS</text><text x="80" y="177" font-size="30" font-weight="700" fill="#fff">🎒 North South</text><text x="80" y="201" font-size="13" fill="#d2e7e3">Kolkata → Leh · 1–10 Sep 2026 · 4 travellers · Motorcycle · Relaxed</text><rect x="1311" y="142" width="205" height="44" rx="14" fill="#f4ab40"/><text x="1338" y="170" font-size="13" font-weight="700" fill="#19323d">Invite &amp; share →</text>
<!-- tabs -->
<text x="71" y="251" font-size="13" fill="#5b7275">Overview</text><text x="157" y="251" font-size="13" fill="#5b7275">Timeline</text><text x="241" y="251" font-size="13" fill="#5b7275">Board ✨</text><text x="327" y="251" font-size="13" fill="#5b7275">Map</text><text x="378" y="251" font-size="13" fill="#5b7275">Suggestions</text><text x="476" y="251" font-size="13" fill="#5b7275">Budget</text><rect x="539" y="229" width="85" height="35" rx="12" fill="#e5f4ee"/><text x="556" y="251" font-size="13" font-weight="700" fill="#0b8178">Decisions</text><text x="643" y="251" font-size="13" fill="#5b7275">Share</text><path d="M50 273H1550" stroke="#d6e2dc"/>
<!-- header -->
<text x="74" y="326" font-size="24" font-weight="700" fill="#14334d">Decide together</text><text x="74" y="351" font-size="13" fill="#637b7d">Turn group chat uncertainty into clear choices, votes and next steps.</text><rect x="1305" y="300" width="216" height="42" rx="14" fill="url(#cta)" filter="url(#soft)"/><text x="1330" y="327" font-size="13" font-weight="700" fill="#fff">＋ Ask the group</text>
<!-- top stat bento -->
<rect x="74" y="380" width="279" height="112" rx="19" fill="#ffffffd9" stroke="#fff" filter="url(#soft)"/><text x="97" y="410" font-size="11" font-weight="700" fill="#708486">OPEN DECISIONS</text><text x="97" y="457" font-size="34" font-weight="700" fill="#d6534d">3</text><text x="157" y="454" font-size="13" font-weight="700" fill="#a34441">Need your crew</text><text x="97" y="477" font-size="11" fill="#677e80">2 due before Day 3</text>
<rect x="370" y="380" width="279" height="112" rx="19" fill="#ffffffd9" stroke="#fff" filter="url(#soft)"/><text x="393" y="410" font-size="11" font-weight="700" fill="#708486">GROUP RESPONSE</text><text x="393" y="457" font-size="34" font-weight="700" fill="#0c8379">71%</text><text x="481" y="454" font-size="13" font-weight="700" fill="#176b63">Votes submitted</text><rect x="393" y="469" width="226" height="6" rx="3" fill="#e2eee9"/><rect x="393" y="469" width="161" height="6" rx="3" fill="#49aa91"/>
<rect x="666" y="380" width="279" height="112" rx="19" fill="#ffffffd9" stroke="#fff" filter="url(#soft)"/><text x="689" y="410" font-size="11" font-weight="700" fill="#708486">RESOLVED</text><text x="689" y="457" font-size="34" font-weight="700" fill="#163f4c">8</text><text x="732" y="454" font-size="13" font-weight="700" fill="#385e63">Since planning began</text><text x="689" y="477" font-size="11" fill="#677e80">Everything saved to the trip</text>
<rect x="962" y="380" width="559" height="112" rx="19" fill="#143f4c" filter="url(#soft)"/><text x="986" y="411" font-size="11" font-weight="700" fill="#c1e1dc">NEXT TO UNBLOCK</text><text x="986" y="444" font-size="17" font-weight="700" fill="#fff">Choose the Day 3 overnight base</text><text x="986" y="469" font-size="12" fill="#d0e5e1">It affects 252 km of riding and your Day 4 start time.</text><text x="1357" y="452" font-size="12" font-weight="700" fill="#ffcd74">Open decision →</text>
<!-- filter rail -->
<text x="74" y="544" font-size="12" font-weight="700" fill="#718687">SHOW</text><rect x="125" y="521" width="79" height="34" rx="13" fill="#0b847b"/><text x="146" y="543" font-size="12" font-weight="700" fill="#fff">Open 3</text><rect x="215" y="521" width="104" height="34" rx="13" fill="#ffffffc5" stroke="#dce7e1"/><text x="234" y="543" font-size="12" fill="#46676a">Needs me 2</text><rect x="330" y="521" width="97" height="34" rx="13" fill="#ffffffc5" stroke="#dce7e1"/><text x="350" y="543" font-size="12" fill="#46676a">Resolved 8</text>
<!-- decision card 1 -->
<rect x="74" y="577" width="957" height="239" rx="22" fill="#ffffffdc" stroke="#fff" filter="url(#shadow)"/><rect x="98" y="602" width="61" height="27" rx="13" fill="#fff0e8"/><text x="110" y="620" font-size="11" font-weight="700" fill="#a45e2d">DAY 3</text><text x="178" y="622" font-size="12" fill="#728486">Due tomorrow · created by Hasnaina</text><text x="98" y="665" font-size="21" font-weight="700" fill="#163c49">Where should we stay after the Sarchu drive?</text><text x="98" y="691" font-size="13" fill="#5c7477">Choose a base that keeps the route realistic and protects the next morning.</text>
<!-- options -->
<rect x="98" y="716" width="265" height="75" rx="15" fill="#e8f5ef" stroke="#78bcae" stroke-width="1.5"/><text x="116" y="741" font-size="13" font-weight="700" fill="#174b50">Sarchu tent camp</text><text x="116" y="762" font-size="11" fill="#527073">Closest · lower comfort</text><circle cx="331" cy="739" r="12" fill="#0d877d"/><text x="327" y="743" font-size="10" font-weight="700" fill="#fff">2</text>
<rect x="376" y="716" width="265" height="75" rx="15" fill="#fff" stroke="#dfe8e2"/><text x="394" y="741" font-size="13" font-weight="700" fill="#174b50">Jispa hotel</text><text x="394" y="762" font-size="11" fill="#527073">More comfort · +1h 40m drive</text><circle cx="609" cy="739" r="12" fill="#f3b34d"/><text x="605" y="743" font-size="10" font-weight="700" fill="#744c1b">1</text>
<rect x="654" y="716" width="265" height="75" rx="15" fill="#fff" stroke="#dfe8e2"/><text x="672" y="741" font-size="13" font-weight="700" fill="#174b50">Keep it flexible</text><text x="672" y="762" font-size="11" fill="#527073">Decide based on road conditions</text><circle cx="887" cy="739" r="12" fill="#e8edf0"/><text x="883" y="743" font-size="10" font-weight="700" fill="#53686b">0</text>
<!-- side impact panel -->
<rect x="1050" y="577" width="471" height="239" rx="22" fill="#fff7eb" stroke="#f4e1bd" filter="url(#soft)"/><text x="1075" y="611" font-size="11" font-weight="700" fill="#a06829">ROUTE IMPACT</text><text x="1075" y="646" font-size="16" font-weight="700" fill="#573e2a">If the group picks Jispa</text><text x="1075" y="677" font-size="13" fill="#755b40">+1h 40m driving on Day 3</text><text x="1075" y="703" font-size="13" fill="#755b40">Arrival shifts to ~9:25 PM</text><text x="1075" y="729" font-size="13" fill="#755b40">+₹1,200 estimated stay cost</text><rect x="1075" y="752" width="169" height="36" rx="12" fill="#fff" stroke="#e9d9bd"/><text x="1092" y="775" font-size="12" font-weight="700" fill="#9a5a25">View comparison →</text>
<!-- second and third compact cards -->
<rect x="74" y="840" width="710" height="129" rx="20" fill="#ffffffd8" stroke="#fff" filter="url(#soft)"/><rect x="98" y="865" width="60" height="26" rx="13" fill="#f0eafa"/><text x="111" y="882" font-size="11" font-weight="700" fill="#69518e">DAY 6</text><text x="177" y="882" font-size="12" fill="#758a8b">4 of 4 votes needed</text><text x="98" y="919" font-size="17" font-weight="700" fill="#173e4a">Add Pangong Lake as an overnight detour?</text><text x="98" y="944" font-size="12" fill="#5c7477">Adds 1 day and ~₹2,300 per traveller.</text><text x="654" y="918" font-size="12" font-weight="700" fill="#0b8178">Vote now →</text>
<rect x="806" y="840" width="715" height="129" rx="20" fill="#ffffffd8" stroke="#fff" filter="url(#soft)"/><rect x="830" y="865" width="64" height="26" rx="13" fill="#fff0e8"/><text x="843" y="882" font-size="11" font-weight="700" fill="#a45e2d">DAY 10</text><text x="905" y="882" font-size="12" fill="#758a8b">Waiting for 2 travellers</text><text x="830" y="919" font-size="17" font-weight="700" fill="#173e4a">Should we book the return train now?</text><text x="830" y="944" font-size="12" fill="#5c7477">Fare may rise; the departure time protects the final drive.</text><text x="1389" y="918" font-size="12" font-weight="700" fill="#0b8178">Open →</text>
<!-- assistant nudge -->
<rect x="74" y="992" width="1447" height="58" rx="18" fill="#143f4c" filter="url(#soft)"/><text x="100" y="1028" font-size="14" font-weight="700" fill="#fff">✨ Ask YatraFlow Assistant</text><text x="307" y="1028" font-size="13" fill="#c5e1dc">“Which decision will make the biggest difference to the plan?”</text><text x="1326" y="1028" font-size="12" font-weight="700" fill="#ffcb72">Get recommendation →</text>
<text x="74" y="1090" font-size="17" font-weight="700" fill="#14334d">5. Decisions — social clarity, not another task list</text><text x="74" y="1111" font-size="13" fill="#5e7779">Each group choice is tied to timing, cost and route consequences, so votes become informed decisions rather than disconnected chat messages.</text>
</g></svg>