  <filter id="soft" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#143b41" flood-opacity=".11"/></filter>
</defs>
<rect width="1600" height="1120" fill="url(#bg)"/>
<g font-family="Arial, sans-serif">
