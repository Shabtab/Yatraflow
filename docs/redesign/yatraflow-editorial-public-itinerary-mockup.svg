<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1420" viewBox="0 0 1600 1420" role="img" aria-label="YatraFlow editorial public itinerary mockup using Calm Travel Intelligence design language">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d4b56"/><stop offset=".46" stop-color="#176e70"/><stop offset="1" stop-color="#e18d51"/></linearGradient>
  <linearGradient id="mist" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#ffffff00"/><stop offset="1" stop-color="#102f43" stop-opacity=".84"/></linearGradient>
  <linearGradient id="paper" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#fffdf6"/><stop offset="1" stop-color="#f6f1e6"/></linearGradient>
  <linearGradient id="cta" x1="0" x2="1"><stop stop-color="#0e9185"/><stop offset="1" stop-color="#0b6e69"/></linearGradient>
  <filter id="shadow" x="-25%" y="-25%" width="150%" height="155%"><feDropShadow dx="0" dy="13" stdDeviation="20" flood-color="#14383d" flood-opacity=".17"/></filter>
  <filter id="soft" x="-25%" y="-25%" width="150%" height="155%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#14383d" flood-opacity=".12"/></filter>
  <pattern id="topo" width="90" height="90" patternUnits="userSpaceOnUse"><path d="M-10 65c24-34 62-31 110-67M-8 83c25-35 74-28 109-57M34-3C24 22 54 42 39 94" fill="none" stroke="#fff" stroke-opacity=".18" stroke-width="1.5"/></pattern>
</defs>
<rect width="1600" height="1420" fill="#f6f3eb"/>
<!-- Top hero -->
<rect width="1600" height="590" fill="url(#sky)"/><rect width="1600" height="590" fill="url(#topo)"/>
<path d="M0 407 C174 292 284 473 470 359 S756 209 948 364 S1253 468 1600 242V590H0Z" fill="#143c4a" fill-opacity=".44"/>
<path d="M0 474 C200 354 332 549 554 438 S834 342 1027 468 1344 521 1600 399V590H0Z" fill="#102f43" fill-opacity=".73"/>
<rect width="1600" height="590" fill="url(#mist)"/>
<!-- nav -->
<rect x="39" y="26" width="1522" height="63" rx="19" fill="#ffffff2c" stroke="#fff" stroke-opacity=".31"/>
<circle cx="78" cy="58" r="16" fill="#fff" fill-opacity=".94"/><path d="M70 62c4-11 10-11 16 0" fill="none" stroke="#0b8178" stroke-width="2"/><text x="104" y="66" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#fff">Yatra<tspan fill="#a9eadc">Flow</tspan></text>
<text x="1248" y="64" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#fff">Explore itineraries</text><rect x="1395" y="41" width="137" height="34" rx="12" fill="#fff"/><text x="1417" y="63" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#163846">Plan your trip →</text>
<!-- hero copy -->
<g font-family="Arial, sans-serif"><rect x="154" y="146" width="202" height="31" rx="15" fill="#fff7e6" fill-opacity=".95"/><text x="173" y="167" font-size="12" font-weight="700" fill="#8e5b21">FEATURED ROAD ITINERARY</text><text x="151" y="260" font-size="64" font-weight="700" fill="#fff">A slow road to</text><text x="151" y="333" font-size="64" font-weight="700" fill="#fff">the high Himalayas.</text><text x="155" y="380" font-size="18" fill="#e2f1ef">A 10-day motorcycle journey from Kolkata to Leh —</text><text x="155" y="407" font-size="18" fill="#e2f1ef">built around real road time, rest and unforgettable stops.</text><text x="155" y="468" font-size="13" font-weight="700" fill="#e2f1ef">BY HASNAINA  ·  10 DAYS  ·  4 TRAVELLERS  ·  MOTORCYCLE</text></g>
<!-- hero stat cluster -->
<g filter="url(#shadow)" font-family="Arial, sans-serif"><rect x="1004" y="359" width="402" height="158" rx="21" fill="#fffdf5" fill-opacity=".96"/><text x="1030" y="393" font-size="11" font-weight="700" fill="#6b8080">THE PRACTICAL BIT</text><text x="1030" y="432" font-size="25" font-weight="700" fill="#14344b">₹5,408</text><text x="1136" y="431" font-size="12" fill="#5c7172">estimated per traveller</text><path d="M1030 449H1379" stroke="#e2e7df"/><text x="1030" y="480" font-size="12" fill="#607778">4,807 km</text><text x="1134" y="480" font-size="12" fill="#607778">60h 15m on the road</text><text x="1272" y="480" font-size="12" fill="#607778">8 planned stops</text></g>
<!-- paper content -->
<rect x="92" y="542" width="1416" height="805" rx="30" fill="url(#paper)" filter="url(#shadow)"/>
<g font-family="Arial, sans-serif">
<!-- action rail -->
<rect x="127" y="577" width="1346" height="65" rx="18" fill="#ffffffc9" stroke="#eee6d8"/><text x="153" y="617" font-size="14" font-weight="700" fill="#183e47">Made to be copied, adjusted and made your own.</text><rect x="1074" y="593" width="162" height="35" rx="12" fill="#fff4e3"/><text x="1097" y="616" font-size="12" font-weight="700" fill="#a25f25">♡ Save itinerary</text><rect x="1250" y="593" width="190" height="35" rx="12" fill="url(#cta)"/><text x="1272" y="616" font-size="12" font-weight="700" fill="#fff">Fork this trip  →</text>
<!-- left editorial narrative -->
<text x="151" y="716" font-size="13" font-weight="700" fill="#0b8a80">THE JOURNEY</text><text x="151" y="765" font-size="34" font-weight="700" fill="#15334c">Why this route works</text><text x="151" y="806" font-size="16" fill="#526c70">This is not the fastest way to Leh. It is deliberately paced</text><text x="151" y="831" font-size="16" fill="#526c70">for a motorcycle crew: realistic wheel time, sleep where it</text><text x="151" y="856" font-size="16" fill="#526c70">matters, and enough room for the moments you travelled for.</text><text x="151" y="911" font-size="14" font-weight="700" fill="#153c45">Route philosophy</text><text x="151" y="941" font-size="14" fill="#5a7375">• Drive days are balanced with rest and acclimatisation.</text><text x="151" y="969" font-size="14" fill="#5a7375">• Each major leg has planned meal, fuel or stretch breaks.</text><text x="151" y="997" font-size="14" fill="#5a7375">• Flexible stops can be moved without losing the route logic.</text>
<!-- route card -->
<rect x="860" y="682" width="558" height="337" rx="23" fill="#143f4b" filter="url(#soft)"/><text x="889" y="717" font-size="12" font-weight="700" fill="#bbe0d9">THE ROUTE AT A GLANCE</text><path d="M899 920 C975 789 1053 944 1141 821 S1287 773 1380 832" fill="none" stroke="#efaa42" stroke-width="8" stroke-linecap="round"/><path d="M899 920 C975 789 1053 944 1141 821 S1287 773 1380 832" fill="none" stroke="#fff9df" stroke-width="2.5" stroke-dasharray="8 8"/>
<g font-size="11" font-weight="700" text-anchor="middle"><circle cx="910" cy="905" r="14" fill="#fff"/><text x="910" y="909" fill="#155b60">1</text><circle cx="1056" cy="917" r="14" fill="#fff"/><text x="1056" y="921" fill="#155b60">3</text><circle cx="1141" cy="821" r="14" fill="#fff"/><text x="1141" y="825" fill="#155b60">5</text><circle cx="1378" cy="832" r="14" fill="#fff"/><text x="1378" y="836" fill="#155b60">10</text></g><text x="890" y="970" font-size="12" fill="#d5e7e4">Kolkata  ·  Patna  ·  Sarchu  ·  Leh</text><text x="1242" y="970" font-size="12" font-weight="700" fill="#fff">Open interactive map →</text>
<!-- day highlights -->
<text x="151" y="1087" font-size="13" font-weight="700" fill="#0b8a80">TRIP HIGHLIGHTS</text><text x="151" y="1131" font-size="30" font-weight="700" fill="#15334c">The rhythm of 10 days</text>
<rect x="151" y="1160" width="394" height="127" rx="19" fill="#fff" stroke="#ece4d7"/><text x="176" y="1191" font-size="11" font-weight="700" fill="#0d837a">DAY 01 · ROAD DAY</text><text x="176" y="1220" font-size="18" font-weight="700" fill="#173f47">Kolkata to Bihar</text><text x="176" y="1246" font-size="13" fill="#627a7d">655 km · fuel and meal breaks included</text><rect x="432" y="1177" width="89" height="28" rx="12" fill="#fff0e8"/><text x="447" y="1196" font-size="11" font-weight="700" fill="#a1602f">Route day</text>
<rect x="563" y="1160" width="394" height="127" rx="19" fill="#fff" stroke="#ece4d7"/><text x="588" y="1191" font-size="11" font-weight="700" fill="#0d837a">DAY 05 · ARRIVAL</text><text x="588" y="1220" font-size="18" font-weight="700" fill="#173f47">First day in Leh</text><text x="588" y="1246" font-size="13" fill="#627a7d">Acclimatisation first; sunset if everyone feels good</text><rect x="835" y="1177" width="99" height="28" rx="12" fill="#e8f5ef"/><text x="851" y="1196" font-size="11" font-weight="700" fill="#176c62">Easy pace</text>
<rect x="975" y="1160" width="394" height="127" rx="19" fill="#fff" stroke="#ece4d7"/><text x="1000" y="1191" font-size="11" font-weight="700" fill="#0d837a">DAY 08 · EXPLORATION</text><text x="1000" y="1220" font-size="18" font-weight="700" fill="#173f47">Nubra Valley loop</text><text x="1000" y="1246" font-size="13" fill="#627a7d">High pass views with flexible photography stops</text><rect x="1264" y="1177" width="82" height="28" rx="12" fill="#f1eafa"/><text x="1278" y="1196" font-size="11" font-weight="700" fill="#67528f">Scenic</text>
<!-- footer -->
<text x="800" y="1390" text-anchor="middle" font-size="13" fill="#708486">Published with YatraFlow · Plan real trips, together</text>
</g>
