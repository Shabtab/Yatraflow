name: Android APK

# Builds the debug APK in CI so the app can ship to a phone without any local
# Android toolchain (the dev machine that owns this branch has no Java/Android
# SDK). Runs on pushes to the Capacitor branch and on demand from any branch.
#
# The APK is signed with a STABLE key (DEBUG_KEYSTORE secret): GitHub runners
# generate a fresh debug keystore per run, so every artifact had a different
# signature and Android silently refused to install updates over a previous
# build ("app not installed" / nothing visibly changing). One fixed key makes
# every build updatable by the next.
on:
  push:
    branches: ['feat/capacitor-android']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: Debug APK (web build + gradle)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Capacitor 8 targets compileSdk 36 / AGP 8.9+, which needs JDK 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      # The anon key is public by design (RLS is the real auth boundary) and
      # the bundle needs it at compile time, but it doesn't belong in the repo
      # — repo secrets inject it (and the map keys) at build time only.
      - name: Write web build env
        run: |
          printf 'VITE_SUPABASE_URL=%s\n' "${{ secrets.VITE_SUPABASE_URL }}" >> .env.production
          printf 'VITE_SUPABASE_ANON_KEY=%s\n' "${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> .env.production
          printf 'VITE_MAPPLS_KEY=%s\n' "${{ secrets.VITE_MAPPLS_KEY }}" >> .env.production
          printf 'VITE_GOOGLE_MAPS_API_KEY=%s\n' "${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}" >> .env.production

      - name: Build web bundle
        run: npm run build

      - name: Sync web assets + plugins to Android
        run: npx cap sync android

      # Materialize the stable signing key where app/build.gradle expects it
      # (app/yatraflow-debug.p12), then build. The secret never touches the repo.
      - name: Write stable debug keystore
        run: |
          printf '%s' "${{ secrets.DEBUG_KEYSTORE }}" | base64 --decode > android/app/yatraflow-debug.p12

      - name: Build debug APK
        working-directory: android
        # chmod for checkouts where the executable bit was lost (Windows devs);
        # a no-op when git already carries 755.
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK with version
        run: |
          VERSION=$(grep -oP 'versionName "\K[^"]+' android/app/build.gradle)
          cp android/app/build/outputs/apk/debug/app-debug.apk "YatraFlow-v${VERSION}.apk"
          echo "version=$VERSION" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yatraflow-v${{ env.version }}
          path: YatraFlow-v${{ env.version }}.apk
          retention-days: 14
