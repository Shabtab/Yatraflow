name: Android APK

# Builds the debug APK in CI so the app can ship to a phone without any local
# Android toolchain (the dev machine that owns this branch has no Java/Android
# SDK). Runs on pushes to the Capacitor branch and on demand from any branch.
on:
  push:
    branches: ['feat/capacitor-android']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: Debug APK (web build + gradle)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Capacitor 8 targets compileSdk 36 / AGP 8.9+, which needs JDK 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle
        run: npm run build

      - name: Sync web assets + plugins to Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        # chmod for checkouts where the executable bit was lost (Windows devs);
        # a no-op when git already carries 755.
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yatraflow-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
