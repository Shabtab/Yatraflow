name: Android APK

# Builds the signed APK in CI so the app can ship to a phone without any local
# Android toolchain. The Capacitor work now lives on main (the native layer is
# fully platform-gated, so the web app is untouched by it): every push to main
# rebuilds the APK, and cutting a release tag (v*) publishes a versioned
# artifact — the APK release cadence is decoupled from web deploys.
on:
  push:
    branches: ['main']
    tags: ['v*']
  workflow_dispatch:

# contents: write lets the release step create a release and attach the APK.
# A manual run only reads the tree and uploads a workflow artifact.
permissions:
  contents: write

# A main push and a tag push for the same commit must run one after the other.
# The second run then finds the release that the first run made.
concurrency:
  group: apk-${{ github.sha }}
  cancel-in-progress: false

jobs:
  apk:
    name: Debug APK (web build + gradle)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Capacitor 8 targets compileSdk 36 / AGP 8.9+, which needs JDK 21.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      # The anon key is public by design (RLS is the real auth boundary) and
      # the bundle needs it at compile time, but it doesn't belong in the repo
      # — repo secrets inject it (and the map keys) at build time only. All
      # secrets ride via step env: GitHub's startup validation rejects
      # workflows that interpolate secret VALUES (long JWTs, base64 blobs)
      # directly into run: scripts with an instant startup_failure.
      - name: Write web build env
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_MAPPLS_KEY: ${{ secrets.VITE_MAPPLS_KEY }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_APK_UPDATE_FEED_URL: ${{ vars.VITE_APK_UPDATE_FEED_URL }}
          VITE_APK_UPDATE_HOSTS: ${{ vars.VITE_APK_UPDATE_HOSTS }}

        run: |
          printf 'VITE_SUPABASE_URL=%s\n' "$VITE_SUPABASE_URL" >> .env.production
          printf 'VITE_SUPABASE_ANON_KEY=%s\n' "$VITE_SUPABASE_ANON_KEY" >> .env.production
          printf 'VITE_MAPPLS_KEY=%s\n' "$VITE_MAPPLS_KEY" >> .env.production
          printf 'VITE_GOOGLE_MAPS_API_KEY=%s\n' "$VITE_GOOGLE_MAPS_API_KEY" >> .env.production
          printf 'VITE_APK_UPDATE_FEED_URL=%s\n' "$VITE_APK_UPDATE_FEED_URL" >> .env.production
          printf 'VITE_APK_UPDATE_HOSTS=%s\n' "$VITE_APK_UPDATE_HOSTS" >> .env.production


      - name: Build web bundle
        run: npm run build

      - name: Sync web assets + plugins to Android
        run: npx cap sync android

      # Materialize the stable signing key where app/build.gradle expects it
      # (app/yatraflow-debug.p12), then build. The keystore secret rides via
      # step env — interpolating the large base64 blob directly into run:
      # made GitHub's runner fail the whole workflow at startup (instant
      # startup_failure, zero jobs created). The short VITE_* values above
      # are fine inline.
      - name: Write stable debug keystore
        env:
          DEBUG_KEYSTORE: ${{ secrets.DEBUG_KEYSTORE }}
        run: printf '%s' "$DEBUG_KEYSTORE" | base64 --decode > android/app/yatraflow-debug.p12

      - name: Build signed debug APK
        working-directory: android
        # chmod for checkouts where the executable bit was lost (Windows devs);
        # a no-op when git already carries 755.
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Version the artifact
        # Tag builds name themselves (YatraFlow-v0.7.0); branch builds fall
        # back to the package version plus the short SHA so consecutive main
        # pushes are still distinguishable. package.json is the source the
        # gradle file reads its versionCode/versionName from.
        run: |
          if [[ "$GITHUB_REF_NAME" == v* ]]; then
            echo "apkname=YatraFlow-${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            V=$(node -p "require('./package.json').version")
            echo "apkname=YatraFlow-v${V}+${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.apkname }}
          # The file carries its own versioned name from build.gradle, so the
          # path follows it instead of the default app-debug name.
          path: android/app/build/outputs/apk/debug/YatraFlow-*.apk
          retention-days: 14

      # A tag run once stopped at the workflow artifact, which expires after 14
      # days and never appears on the release page. A forgotten tag or release
      # then left a version without an APK (v0.79.0, v0.79.1, v0.87.1, v0.88.1).
      # This step now runs on every push: it creates the release when none
      # exists, then attaches the APK.
      # - A tag run uses the pushed tag. It waits up to 60 s for a release that a
      #   person creates right after the tag, so hand-written notes win.
      # - A main run uses v plus the package.json version. The release creates
      #   the tag at the pushed commit. A tag made with GITHUB_TOKEN does not
      #   start another workflow run, so this does not cause a second build.
      # - A main run stops with a warning when the tag points at another commit.
      #   That means main moved without a version bump.
      - name: Attach APK to the release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            RUN_KIND=tag
            TAG="$GITHUB_REF_NAME"
          else
            RUN_KIND=main
            TAG="v$(node -p "require('./package.json').version")"
          fi
          VERSION="${TAG#v}"

          # The commit that the remote tag points at. An annotated tag lists its
          # commit on the peeled (^{}) line. A lightweight tag lists it directly.
          tag_commit() {
            local refs
            refs=$(git ls-remote --tags origin "refs/tags/${TAG}" "refs/tags/${TAG}^{}")
            if grep -q '\^{}$' <<<"$refs"; then
              grep '\^{}$' <<<"$refs" | cut -f1
            else
              cut -f1 <<<"$refs"
            fi
          }

          release_exists() { gh release view "$TAG" >/dev/null 2>&1; }

          if [[ "$RUN_KIND" == main ]]; then
            EXISTING=$(tag_commit)
            if [[ -n "$EXISTING" && "$EXISTING" != "$GITHUB_SHA" ]]; then
              echo "::warning::Tag $TAG points at $EXISTING, not at $GITHUB_SHA. Main moved without a version bump. The release is not changed."
              exit 0
            fi
          else
            for attempt in 1 2 3 4 5 6; do
              if release_exists; then break; fi
              echo "release $TAG not there yet (attempt $attempt), waiting"
              sleep 10
            done
          fi

          if ! release_exists; then
            # Notes: the body of the "## [X.Y.Z]" section of CHANGELOG.md, up to
            # the next "## [" heading. The awk filter reads to the end of the
            # input: an early exit would break the pipe and fail under pipefail.
            if ! grep -q "^## \[${VERSION}\]" CHANGELOG.md; then
              echo "::error::CHANGELOG.md has no section for ${VERSION}. A promotion needs one."
              exit 1
            fi
            tr -d '\r' < CHANGELOG.md \
              | awk -v h="## [${VERSION}]" 'index($0, h) == 1 { found = 1; next } /^## \[/ { if (found) done = 1 } found && !done' \
              | sed -e '/./,$!d' > release-notes.md
            if [[ ! -s release-notes.md ]]; then
              echo "::error::The CHANGELOG.md section for ${VERSION} is empty."
              exit 1
            fi

            if [[ "$RUN_KIND" == main ]]; then
              TARGET_FLAG=(--target "$GITHUB_SHA")
            else
              TARGET_FLAG=(--verify-tag)
            fi
            # A parallel run can create the release first. Check again before failing.
            if ! gh release create "$TAG" --title "YatraFlow ${TAG}" --notes-file release-notes.md --latest "${TARGET_FLAG[@]}"; then
              if ! release_exists; then
                echo "::error::Could not create the release for $TAG."
                exit 1
              fi
              echo "Release $TAG was created by another run. Continuing."
            fi
          fi

          gh release upload "$TAG" android/app/build/outputs/apk/debug/YatraFlow-*.apk --clobber
