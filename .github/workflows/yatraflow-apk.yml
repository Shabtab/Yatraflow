name: Android APK

# Builds the signed APK in CI so the app can ship to a phone without any local
# Android toolchain. The Capacitor work now lives on main (the native layer is
# fully platform-gated, so the web app is untouched by it): every push to main
# rebuilds the APK, and cutting a release tag (v*) publishes a versioned
# artifact — the APK release cadence is decoupled from web deploys.
on:
  push:
    branches: ['main', 'feat/capacitor-android']
    tags: ['v*']
  workflow_dispatch:

# contents: write is only used by the tag run, to attach the APK to its release.
# Every branch run reads the tree and uploads a workflow artifact.
permissions:
  contents: write

jobs:
  apk:
    name: Debug APK (web build + gradle)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Capacitor 8 targets compileSdk 36 / AGP 8.9+, which needs JDK 21.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      # The anon key is public by design (RLS is the real auth boundary) and
      # the bundle needs it at compile time, but it doesn't belong in the repo
      # — repo secrets inject it (and the map keys) at build time only. All
      # secrets ride via step env: GitHub's startup validation rejects
      # workflows that interpolate secret VALUES (long JWTs, base64 blobs)
      # directly into run: scripts with an instant startup_failure.
      - name: Write web build env
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_MAPPLS_KEY: ${{ secrets.VITE_MAPPLS_KEY }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
        run: |
          printf 'VITE_SUPABASE_URL=%s\n' "$VITE_SUPABASE_URL" >> .env.production
          printf 'VITE_SUPABASE_ANON_KEY=%s\n' "$VITE_SUPABASE_ANON_KEY" >> .env.production
          printf 'VITE_MAPPLS_KEY=%s\n' "$VITE_MAPPLS_KEY" >> .env.production
          printf 'VITE_GOOGLE_MAPS_API_KEY=%s\n' "$VITE_GOOGLE_MAPS_API_KEY" >> .env.production

      - name: Build web bundle
        run: npm run build

      - name: Sync web assets + plugins to Android
        run: npx cap sync android

      # Materialize the stable signing key where app/build.gradle expects it
      # (app/yatraflow-debug.p12), then build. The keystore secret rides via
      # step env — interpolating the large base64 blob directly into run:
      # made GitHub's runner fail the whole workflow at startup (instant
      # startup_failure, zero jobs created). The short VITE_* values above
      # are fine inline.
      - name: Write stable debug keystore
        env:
          DEBUG_KEYSTORE: ${{ secrets.DEBUG_KEYSTORE }}
        run: printf '%s' "$DEBUG_KEYSTORE" | base64 --decode > android/app/yatraflow-debug.p12

      - name: Build signed debug APK
        working-directory: android
        # chmod for checkouts where the executable bit was lost (Windows devs);
        # a no-op when git already carries 755.
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Version the artifact
        # Tag builds name themselves (YatraFlow-v0.7.0); branch builds fall
        # back to the package version plus the short SHA so consecutive main
        # pushes are still distinguishable. package.json is the source the
        # gradle file reads its versionCode/versionName from.
        run: |
          if [[ "$GITHUB_REF_NAME" == v* ]]; then
            echo "apkname=YatraFlow-${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            V=$(node -p "require('./package.json').version")
            echo "apkname=YatraFlow-v${V}+${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: ${{ env.apkname }}
          # The file carries its own versioned name from build.gradle, so the
          # path follows it instead of the default app-debug name.
          path: android/app/build/outputs/apk/debug/YatraFlow-*.apk
          retention-days: 14

      # A tag run previously stopped at the workflow artifact, which expires
      # after 14 days and never appears on the release page: v0.79.0 and
      # v0.79.1 shipped with no APK. Attach the same file to the release, and
      # wait briefly for a release that is created just after the tag.
      - name: Attach APK to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then break; fi
            echo "release $GITHUB_REF_NAME not there yet (attempt $attempt), waiting"
            sleep 10
          done
          gh release upload "$GITHUB_REF_NAME" android/app/build/outputs/apk/debug/YatraFlow-*.apk --clobber
