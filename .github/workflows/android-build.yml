name: Android APK

# Same as android-build.yml but WITHOUT any ${{ secrets.* }} or keystore step:
# bisects whether the startup failure is caused by the secret expressions.
on:
  push:
    branches: ['apk-branch-test']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: Debug APK (web build + gradle)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle
        run: npm run build

      - name: Sync web assets + plugins to Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YatraFlow-bisect1
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

# trigger
