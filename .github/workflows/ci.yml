name: CI

# Issue #21 — this repo previously had no automated gate: the full verification
# (`tsc -b --clean` -> lint ratchet -> tests -> production build, see
# AGENTS.md "Verification before every push") only ever ran locally/manually,
# which is how a deploy-breaking CSS error (#14) reached main unnoticed. This
# workflow enforces the SAME gate on every PR into a shared branch and on every
# push to one.
#
# The lint ratchet (AGENTS.md §2 rule 14) joined the gate after it caught a
# rules-of-hooks crash that 148 unlinted errors had been hiding. It compares
# each file against eslint-baseline.json and fails only when a count rises, so
# it cannot block work on the existing debt.
#
# `test` belongs in the PR trigger for the same reason `main` does: it is where
# feature work integrates, so while only `main` was listed it was the one
# destination where a green check list proved nothing. A PR into `test` showed
# Codacy and Vercel and no "Verify" job at all, because the gate was waiting for
# the merge to fire it as a `push to test` — after the point where a red tree can
# still be refused. The PR run checks out the merge ref, so it duplicates the
# push run rather than replacing it; the duplication is deliberate, and it is
# what puts the verdict before the merge instead of after it.
on:
  pull_request:
    branches: [main, test]
  push:
    branches: [main, test, 'redesign/**']

permissions:
  contents: read

jobs:
  verify:
    name: Verify (tsc --clean + lint ratchet + tests + build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # vite 8 requires Node ^20.19.0 || >=22.12.0; no engines field is set
          # in package.json, so pin the Node LTS that satisfies it.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run verification gate
        run: npm run verify