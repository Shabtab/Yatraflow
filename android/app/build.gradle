apply plugin: 'com.android.application'

// The Android version follows package.json, so a release cut cannot leave the
// APK reporting an old build. versionCode must rise with every release because
// the in-app update check compares it (see #809), so derive it from the semver
// parts: 0.79.1 -> 7901.
def packageVersion = new groovy.json.JsonSlurper()
        .parseText(file("${project.rootDir}/../package.json").text)
        .version as String
def versionParts = packageVersion.tokenize('.').collect { ((it.find(/\d+/) ?: '0') as int) }

android {
    namespace = "app.yatraflow.mobile"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.yatraflow.mobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // versionCode is the ONLY number the update check compares. Give each
        // published release the next higher integer and never reuse one; a
        // rebuild of a published release keeps its own code. Do not derive it
        // from a date. See docs/APK-UPDATE-FEED.md. The value below follows
        // package.json, so a release cut raises it on its own.
        versionCode versionParts[0] * 10000 + versionParts[1] * 100 + versionParts[2]
        versionName "${packageVersion}-native"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        // Stable CI signing key (repo secret DEBUG_KEYSTORE, a PKCS#12 file):
        // GitHub's runners generate a FRESH debug keystore per build, so every
        // APK signature differed and Android silently refused to update over a
        // previous install (INSTALL_FAILED_UPDATE_INCOMPATIBLE) — the "nothing
        // changed" experience. One fixed key makes every build updatable by the
        // next. The password is a low-value debug credential, safe in CI secrets.
        stableDebug {
            storeFile file("${project.rootDir}/app/yatraflow-debug.p12")
            storePassword System.getenv("DEBUG_KEYSTORE_PASSWORD") ?: "yatraflow2026"
            keyAlias "yatraflow"
            keyPassword System.getenv("DEBUG_KEYSTORE_PASSWORD") ?: "yatraflow2026"
            storeType "PKCS12"
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.stableDebug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    // Name the APK file itself, not only the CI artifact. A sideloaded file
    // must state its version, or every build reads as app-debug.
    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "YatraFlow-v${defaultConfig.versionName}-${variant.buildType.name}.apk"
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
